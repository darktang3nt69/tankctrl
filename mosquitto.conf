# Mosquitto Configuration for TankCtl

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Authentication - per-device credentials, no anonymous access
allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/acl

# Max connections
max_connections -1

# Quality of Service
max_queued_messages 1000
